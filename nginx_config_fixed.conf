# 修复后的 Nginx 配置（解决重复指令问题）

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    http2 on;
    listen 443 quic; # 启用 HTTP/3
    server_name aistudy.icu;
    index index.php index.html index.htm;
    root /www/wwwroot/aistudy.icu;

    # =============================
    # 🚀 关键修复：文件上传大小限制
    # =============================
    client_max_body_size 1G;          # 允许上传最大 1GB 文件
    client_body_timeout 300s;         # 客户端请求体超时时间
    client_body_buffer_size 128k;     # 客户端请求体缓冲区大小

    # 证书配置（保持原样）
    ssl_certificate /www/server/panel/vhost/cert/aistudy.icu/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/aistudy.icu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:EECDH+AES256:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    error_page 497 https://$host$request_uri;

    include /www/server/panel/vhost/nginx/extension/aistudy.icu/*.conf;
    include /www/server/panel/vhost/nginx/well-known/aistudy.icu.conf;

    # =============================
    # 🔒 反向代理到 Python 后端
    # =============================
    location / {
        proxy_set_header X-Real-Port $remote_port;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Remote-Host $remote_addr;
        proxy_pass http://localhost:5001;

        # 传递必要的请求头
        proxy_set_header Host localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # =============================
        # 🚀 大文件上传优化配置（统一设置，避免重复）
        # =============================
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;       # 统一设置为10分钟（删除重复的300s）
        proxy_read_timeout 600s;       # 统一设置为10分钟（删除重复的300s）
        
        # 大文件上传支持
        proxy_request_buffering off;   # 禁用请求缓冲，支持流式上传
        proxy_max_temp_file_size 0;    # 禁用临时文件，直接转发

        # =============================
        # ⚡ 关闭缓冲（核心配置）
        # =============================
        proxy_buffering off;           # 禁用反向代理缓冲
        proxy_cache off;               # 关闭缓存
        chunked_transfer_encoding on;  # 启用分块传输编码
        tcp_nopush off;                # 禁用Nagle算法
        tcp_nodelay on;                # 启用TCP无延迟
    }

    # 禁止访问敏感文件（保持不变）
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|LICENSE|README.md) {
        return 404;
    }

    # SSL 证书验证目录（保持不变）
    location /.well-known {
        allow all;
    }

    # 防止上传敏感文件（保持不变）
    if ($uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    # 日志（保持不变）
    access_log /www/wwwlogs/aistudy.icu.log;
    error_log /www/wwwlogs/aistudy.icu.error.log;
}



