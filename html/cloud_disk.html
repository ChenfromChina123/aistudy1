            // ==================== 渲染文本预览 ====================
            function renderTextPreview(text, ext, contentElement) {
                // 限制显示大小，防止超大文件卡顿
                const maxLength = 100000;
                let displayText = text;
                let isLimited = false;
                
                if (text.length > maxLength) {
                    displayText = text.substring(0, maxLength);
                    isLimited = true;
                }
                
                // 保存原始内容用于编辑
                previewOriginalContent = text;
                
                // HTML转义
                const escapedText = displayText
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#039;');
                
                // 代码文件类型列表
                const codeTypes = ['cpp', 'c', 'h', 'hpp', 'cc', 'cxx', 'js', 'py', 'java', 'css', 'html', 'xml', 'json', 'sh', 'bat', 'sql', 'yaml', 'yml'];
                const editableTypes = [...codeTypes, 'txt', 'log', 'md', 'ini', 'conf', 'config'];
                
                // 为代码文件添加语法高亮样式
                const isCodeFile = codeTypes.includes(ext);
                const isEditable = editableTypes.includes(ext);
                const preStyle = isCodeFile ? 
                    `margin: 0; padding: 15px; background: #282c34; border-radius: 4px; overflow: auto; white-space: pre-wrap; word-wrap: break-word; font-family: 'Monaco', 'Courier New', monospace; font-size: 0.85rem; line-height: 1.5; color: #abb2bf; text-align: left; width: 100%; min-height: 300px;` :
                    `margin: 0; padding: 15px; background: var(--light-gray); border-radius: 4px; overflow: auto; white-space: pre-wrap; word-wrap: break-word; font-family: 'Monaco', 'Courier New', monospace; font-size: 0.85rem; line-height: 1.4; color: var(--dark-color); text-align: left; width: 100%; min-height: 300px;`;
                
                const limitedMsg = isLimited ? `<div style="padding: 10px; background: rgba(243, 156, 18, 0.1); color: var(--warning-color); border-radius: 4px; margin-bottom: 10px;">⚠️ 文件过大，仅显示前100KB内容</div>` : '';
                
                const fileTypeLabel = isCodeFile ? `<div style="padding: 8px 12px; background: var(--primary-color); color: white; border-radius: 4px 4px 0 0; font-size: 0.8rem; font-weight: 500;">代码文件 (.${ext})</div>` : '';
                
                contentElement.innerHTML = `
                    ${limitedMsg}
                    ${fileTypeLabel}
                    <pre id="previewTextContent" style="${preStyle}">${escapedText}</pre>
                    <textarea id="previewTextEditor" style="width: 100%; height: 100%; padding: 15px; background: #282c34; border: none; border-radius: 4px; font-family: 'Monaco', 'Courier New', monospace; font-size: 0.85rem; line-height: 1.5; color: #abb2bf; resize: none; display: none;">${text}</textarea>
                `;
                
                // 显示/隐藏编辑按钮
                const editBtn = document.getElementById('previewEditBtn');
                const saveBtn = document.getElementById('previewSaveBtn');
                const cancelBtn = document.getElementById('previewCancelEditBtn');
                
                if (isEditable) {
                    editBtn.style.display = 'block';
                    
                    // 编辑按钮点击事件
                    editBtn.onclick = () => enablePreviewEdit();
                    
                    // 保存按钮点击事件
                    saveBtn.onclick = () => savePreviewChanges();
                    
                    // 取消按钮点击事件
                    cancelBtn.onclick = () => cancelPreviewEdit();
                } else {
                    editBtn.style.display = 'none';
                    saveBtn.style.display = 'none';
                    cancelBtn.style.display = 'none';
                }
            }
            
            // ==================== 启用预览编辑 ====================
            function enablePreviewEdit() {
                isPreviewEditMode = true;
                
                const textContent = document.getElementById('previewTextContent');
                const textEditor = document.getElementById('previewTextEditor');
                const editBtn = document.getElementById('previewEditBtn');
                const saveBtn = document.getElementById('previewSaveBtn');
                const cancelBtn = document.getElementById('previewCancelEditBtn');
                
                textContent.style.display = 'none';
                textEditor.style.display = 'block';
                editBtn.style.display = 'none';
                saveBtn.style.display = 'block';
                cancelBtn.style.display = 'block';
                
                textEditor.focus();
                showNotification('进入编辑模式，修改完成后点击保存', 'info');
            }
            
            // ==================== 取消预览编辑 ====================
            function cancelPreviewEdit() {
                isPreviewEditMode = false;
                
                const textContent = document.getElementById('previewTextContent');
                const textEditor = document.getElementById('previewTextEditor');
                const editBtn = document.getElementById('previewEditBtn');
                const saveBtn = document.getElementById('previewSaveBtn');
                const cancelBtn = document.getElementById('previewCancelEditBtn');
                
                // 恢复原始内容
                textEditor.value = previewOriginalContent;
                
                textContent.style.display = 'block';
                textEditor.style.display = 'none';
                editBtn.style.display = 'block';
                saveBtn.style.display = 'none';
                cancelBtn.style.display = 'none';
                
                showNotification('已取消编辑', 'info');
            }
            function cancelPreviewEdit_1() {
                isPreviewEditMode = false;

                const textContent = document.getElementById('previewTextContent');
                const textEditor = document.getElementById('previewTextEditor');
                const editBtn = document.getElementById('previewEditBtn');
                const saveBtn = document.getElementById('previewSaveBtn');
                const cancelBtn = document.getElementById('previewCancelEditBtn');

                // 恢复原始内容
                textEditor.value = previewOriginalContent;

                textContent.style.display = 'block';
                textEditor.style.display = 'none';
                editBtn.style.display = 'block';
                saveBtn.style.display = 'none';
                cancelBtn.style.display = 'none';


            }
            
            // ==================== 保存预览更改 ====================
            function savePreviewChanges() {
                if (!currentPreviewFileId) {
                    showNotification('无法保存：文件ID丢失', 'error');
                    return;
                }
                
                const textEditor = document.getElementById('previewTextEditor');
                const newContent = textEditor.value;
                
                if (newContent === previewOriginalContent) {
                    showNotification('文件内容未修改', 'warning');
                    return;
                }
                
                showLoading(true);
                
                // 将文本内容转换为 Blob 并上传
                const blob = new Blob([newContent], { type: 'text/plain' });
                const formData = new FormData();
                formData.append('file', blob, currentPreviewFileName);
                formData.append('folder_path', selectedFolderPath);
                
                enhancedFetch(`${API_BASE_URL}/api/cloud_disk/update-file/${currentPreviewFileId}`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    },
                    body: formData
                })
                .then(response => {
                    console.log('保存响应状态:', response.status);
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: 保存失败`);
                    }
                    return response.json();
                })
                .then(data => {
                    showLoading(false);
                    showNotification('✓ 文件保存成功', 'success');
                    
                    // 更新原始内容并退出编辑模式
                    previewOriginalContent = newContent;
                    cancelPreviewEdit_1();
                    
                    // 刷新文件列表（如果已修改）
                    refreshCurrentFolder();
                })
                .catch(error => {
                    showLoading(false);
                    console.error('保存文件失败:', error.message);
                    showNotification(`保存失败: ${error.message}`, 'error');
                });
            }
            
            // ==================== 下载文件 ====================
            function downloadFile(fileId, fileName) {
                console.log(`开始下载文件: ${fileName} (ID: ${fileId})`);
                showLoading(true);
                
                enhancedFetch(`${API_BASE_URL}/api/cloud_disk/download/${fileId}?user_id=${currentUser.id}`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                })
                .then(response => {
                    console.log('下载响应状态:', response.status);
                    
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: 下载失败`);
                    }
                    
                    return response.blob();
                })
                .then(blob => {
                    console.log('下载完成，文件大小:', blob.size, '字节');
                    showLoading(false);
                    
                    // 创建临时链接下载文件
                    const url = window.URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = fileName || '下载文件';
                    document.body.appendChild(link);
                    link.click();
                    
                    // 清理
                    setTimeout(() => {
                        document.body.removeChild(link);
                        window.URL.revokeObjectURL(url);
                    }, 100);
                    
                    showNotification('✓ 文件下载成功', 'success');
                })
                .catch(error => {
                    showLoading(false);
                    console.error('下载失败:', error.message);
                    showNotification(`下载失败: ${error.message}`, 'error');
                });
            }
            
            // ==================== 批量下载文件 ====================
            function downloadSelectedFiles() {
                if (selectedFiles.size === 0) {
                    showNotification('请先选择要下载的文件', 'warning');
                    return;
                }
                
                console.log(`开始批量下载 ${selectedFiles.size} 个文件`);
                
                // 逐个下载选中的文件
                selectedFiles.forEach((fileId) => {
                    const fileElement = document.querySelector(`[data-file-id="${fileId}"]`);
                    if (fileElement) {
                        const fileName = fileElement.dataset.fileName;
                        // 延迟下载，避免浏览器阻止
                        setTimeout(() => {
                            downloadFile(fileId, fileName);
                        }, 500);
                    }
                });
                
                showNotification(`开始下载 ${selectedFiles.size} 个文件`, 'info');
            }
            
            // ==================== 删除文件 ====================
            async function deleteFile(fileId) {
                const shouldDelete = await showDeleteConfirmDialog('确定要删除此文件吗？');
                if (!shouldDelete) return;
                
                showLoading(true);
                
                enhancedFetch(`${API_BASE_URL}/api/cloud_disk/delete/${fileId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                })
                .then(response => response.json())
                .then(data => {
                    showLoading(false);
                    showNotification('文件已删除', 'success');
                    // 使用更新缓存的刷新方式，实时显示删除效果
                    refreshCurrentFolderWithUpdate();
                })
                .catch(error => {
                    showLoading(false);
                    console.error('删除失败:', error);
                    showNotification('删除失败', 'error');
                });
            }
            
            // ==================== 批量删除文件 ====================
            async function deleteSelectedFiles() {
                if (selectedFiles.size === 0) {
                    showNotification('请先选择要删除的文件', 'warning');
                    return;
                }
                
                const count = selectedFiles.size;
                const shouldDelete = await showDeleteConfirmDialog(`确定要删除选中的 ${count} 个文件吗？`);
                if (!shouldDelete) return;
                
                console.log(`开始批量删除 ${count} 个文件`);
                showLoading(true);
                
                let deletedCount = 0;
                let errorCount = 0;
                const fileIds = Array.from(selectedFiles);
                
                // 顺序删除每个文件
                function deleteNext(index) {
                    if (index >= fileIds.length) {
                        showLoading(false);
                        console.log(`\n=== 删除完成 ===`);
                        console.log(`成功: ${deletedCount}, 失败: ${errorCount}`);
                        
                        if (errorCount === 0) {
                            showNotification(`✓ 成功删除 ${deletedCount} 个文件`, 'success');
                        } else if (deletedCount === 0) {
                            showNotification(`✗ 删除失败，${errorCount} 个文件删除失败`, 'error');
                        } else {
                            showNotification(`⚠ 成功 ${deletedCount} 个，失败 ${errorCount} 个`, 'warning');
                        }
                        
                        // 刷新当前文件夹的文件列表并更新缓存，保持用户在同一个文件夹中
                        refreshCurrentFolderWithUpdate();
                        clearFileSelection();
                        return;
                    }
                    
                    const fileId = fileIds[index];
                    enhancedFetch(`${API_BASE_URL}/api/cloud_disk/delete/${fileId}`, {
                        method: 'DELETE',
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    })
                    .then(response => response.json())
                    .then(data => {
                        deletedCount++;
                        console.log(`✓ 删除文件 ${fileId} (${deletedCount + errorCount}/${fileIds.length})`);
                        deleteNext(index + 1);
                    })
                    .catch(error => {
                        errorCount++;
                        console.error(`✗ 删除文件 ${fileId} 失败: ${error.message} (${deletedCount + errorCount}/${fileIds.length})`);
                        deleteNext(index + 1);
                    });
                }
                
                deleteNext(0);
            }
            
            // ==================== 显示新建文件夹对话框 ====================
            function showCreateFolderDialog(existingFolderNames) {
                return new Promise((resolve) => {
                    const overlay = document.getElementById('createFolderDialogOverlay');
                    const input = document.getElementById('createFolderNameInput');
                    const errorMsg = document.getElementById('folderNameError');
                    const confirmBtn = document.getElementById('createFolderConfirmBtn');
                    const cancelBtn = document.getElementById('createFolderCancelBtn');
                    
                    // 重置
                    input.value = '';
                    errorMsg.style.display = 'none';
                    errorMsg.textContent = '';
                    
                    // 实时检查文件夹名称
                    input.addEventListener('input', (e) => {
                        const folderName = e.target.value.trim();
                        if (existingFolderNames.has(folderName)) {
                            errorMsg.textContent = `⚠️ 同名文件夹已存在，请修改`;
                            errorMsg.style.display = 'block';
                        } else if (folderName === '') {
                            errorMsg.style.display = 'none';
                        } else {
                            errorMsg.style.display = 'none';
                        }
                    });
                    
                    const handleConfirm = () => {
                        const folderName = input.value.trim();
                        
                        if (folderName === '') {
                            showNotification('文件夹名称不能为空', 'warning');
                            return;
                        }
                        
                        if (existingFolderNames.has(folderName)) {
                            showNotification('同名文件夹已存在，请修改', 'warning');
                            input.focus();
                            return;
                        }
                        
                        cleanup();
                        resolve(folderName);
                    };
                    
                    const handleCancel = () => {
                        cleanup();
                        resolve(null);
                    };
                    
                    const cleanup = () => {
                        overlay.classList.remove('show');
                        confirmBtn.removeEventListener('click', handleConfirm);
                        cancelBtn.removeEventListener('click', handleCancel);
                        input.removeEventListener('keydown', handleKeydown);
                    };
                    
                    const handleKeydown = (e) => {
                        if (e.key === 'Enter') {
                            handleConfirm();
                        } else if (e.key === 'Escape') {
                            handleCancel();
                        }
                    };
                    
                    confirmBtn.addEventListener('click', handleConfirm);
                    cancelBtn.addEventListener('click', handleCancel);
                    input.addEventListener('keydown', handleKeydown);
                    
                    overlay.classList.add('show');
                    input.focus();
                });
            }
            
            // ==================== 新建文件夹 ====================
            async function createNewFolder() {
                if (!cachedTreeData) {
                    showNotification('文件夹数据未加载', 'warning');
                    return;
                }
                
                // 获取当前文件夹中的所有子文件夹名称
                const currentFolderChildren = findFolderChildren(cachedTreeData, selectedFolderPath);
                const existingFolderNames = new Set(
                    currentFolderChildren
                        .filter(child => child.type === 'folder')
                        .map(child => child.name)
                );
                
                // 显示自定义对话框
                const folderName = await showCreateFolderDialog(existingFolderNames);
                if (!folderName) return;
                
                const newPath = selectedFolderPath.replace(/\/$/, '') + '/' + folderName + '/';
                
                showLoading(true);
                
                enhancedFetch(`${API_BASE_URL}/api/cloud_disk/create-folder`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        folder_path: newPath
                    })
                })
                .then(response => response.json())
                .then(data => {
                    showLoading(false);
                    showNotification('文件夹创建成功', 'success');
                    // 刷新树结构以显示新文件夹，同时保持当前文件夹的选择
                    refreshTreeAndRestoreFolder();
                })
                .catch(error => {
                    showLoading(false);
                    console.error('创建文件夹失败:', error);
                    showNotification('创建文件夹失败', 'error');
                });
            }
            
            // ==================== 查找文件夹的子项 ====================
            function findFolderChildren(tree, targetPath) {
                if (tree.path === targetPath) {
                    return tree.children || [];
                }
                
                if (tree.children) {
                    for (let child of tree.children) {
                        if (child.type === 'folder') {
                            const result = findFolderChildren(child, targetPath);
                            if (result.length > 0 || child.path === targetPath) {
                                return result;
                            }
                        }
                    }
                }
                
                return [];
            }
            
            // ==================== 删除文件夹 ====================
            async function deleteFolder() {
                // 不允许删除根目录
                if (selectedFolderPath === '/' || selectedFolderPath === '/root/files' || !selectedFolderPath) {
                    showNotification('不能删除根目录', 'warning');
                    return;
                }
                
                // 获取当前文件夹名称
                const folderName = document.getElementById('contentTitle').textContent || '此文件夹';
                const message = `确定要删除文件夹"${folderName}"吗？\n\n该操作会删除文件夹中的所有文件，此操作不可撤销！`;
                const shouldDelete = await showDeleteConfirmDialog(message);
                if (!shouldDelete) return;
                
                showLoading(true);
                
                enhancedFetch(`${API_BASE_URL}/api/cloud_disk/delete-folder`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        folder_path: selectedFolderPath
                    })
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    showLoading(false);
                    showNotification('文件夹已删除', 'success');
                    // 清除缓存，强制刷新树结构（因为删除的是当前文件夹）
                    cachedTreeData = null;
                    // 重新加载树并自动选中根目录
                    loadFolderTree(true);
                })
                .catch(error => {
                    showLoading(false);
                    console.error('删除文件夹失败:', error);
                    showNotification('删除文件夹失败: ' + error.message, 'error');
                });
            }
            
            // ==================== 工具函数 ====================
            function getFileIcon(filename) {
                if (!filename || typeof filename !== 'string') {
                    return '📄';
                }
                
                const extension = filename.split('.').pop().toLowerCase();
                
                const iconMap = {
                    'txt': '📄', 'pdf': '📑', 'doc': '📃', 'docx': '📃',
                    'xls': '📊', 'xlsx': '📊', 'ppt': '📽️', 'pptx': '📽️',
                    'jpg': '🖼️', 'jpeg': '🖼️', 'png': '🖼️', 'gif': '🖼️',
                    'mp4': '🎬', 'avi': '🎬', 'mov': '🎬',
                    'zip': '📦', 'rar': '📦', '7z': '📦',
                    'py': '🐍', 'js': '📝', 'html': '🌐', 'css': '🎨'
                };
                
                return iconMap[extension] || '📄';
            }
            
            function formatFileSize(bytes) {
                if (bytes === 0) return '0 B';
                const k = 1024;
                const sizes = ['B', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
            }
            
            function formatDate(isoString) {
                const date = new Date(isoString);
                const year = date.getFullYear();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');
                const hours = String(date.getHours()).padStart(2, '0');
                const minutes = String(date.getMinutes()).padStart(2, '0');
                
                return `${year}/${month}/${day} ${hours}:${minutes}`;
            }
            
            function showLoading(show) {
                document.getElementById('loadingOverlay').classList.toggle('show', show);
            }
            
            function showNotification(message, type = 'info') {
                const notification = document.createElement('div');
                notification.className = `notification ${type}`;
                notification.textContent = message;
                document.body.appendChild(notification);
                
                setTimeout(() => {
                    notification.style.animation = 'slideIn 0.3s ease-out reverse';
                    setTimeout(() => notification.remove(), 300);
                }, 3000);
            }
        </script>
