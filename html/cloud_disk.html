            // ==================== 令牌验证 ====================
            function validateToken() {
                // 在函数内部重新获取token，尝试多种可能的存储位置
                const token = localStorage.getItem('access_token') || localStorage.getItem('aiLearningToken');
                
                return new Promise((resolve, reject) => {
                    enhancedFetch(`${API_BASE_URL}/api/auth/verify`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        }
                    })
                    .then(response => {
                        console.log('验证Token响应状态:', response.status);
                        
                        if (!response.ok) {
                            // 获取错误详情
                            return response.json().then(data => {
                                throw new Error(data.detail || 'Token验证失败');
                            }).catch(() => {
                                throw new Error(`HTTP ${response.status}: Token验证失败`);
                            });
                        }
                        return response.json();
                    })
                    .then(data => {
                        console.log('验证Token响应数据:', data);
                        
                        // 同时检查data.valid和data.user_id，与后端实现匹配
                        if (data.valid || data.user_id) {
                            resolve(data);
                        } else {
                            throw new Error('Token无效');
                        }
                    })
                    .catch(error => {
                        console.error('Token验证异常:', error.message);
                        // 显示详细的错误信息
                        if (error.message.includes('无法连接到服务器') || error.message.includes('请求超时')) {
                            showNotification(error.message, 'error');
                        }
                        // 不自动清除token，避免用户频繁登出
                        resolve({valid: false});
                    });
                });
            }
            
            // ==================== 初始化文件夹结构 ====================
            function initFolderStructure() {
                return new Promise((resolve, reject) => {
                    const token = localStorage.getItem('access_token') || localStorage.getItem('aiLearningToken');
                    
                    if (!currentUser || !currentUser.id) {
                        reject(new Error('用户信息不完整'));
                        return;
                    }
                    
                    enhancedFetch(`${API_BASE_URL}/api/cloud_disk/init-folder-structure`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        }
                    })
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`HTTP ${response.status}: 初始化文件夹结构失败`);
                        }
                        return response.json();
                    })
                    .then(data => {
                        console.log('文件夹结构初始化成功:', data);
                        resolve(data);
                    })
                    .catch(error => {
                        console.error('初始化文件夹结构异常:', error.message);
                        // 显示详细的错误信息
                        if (error.message.includes('无法连接到服务器') || error.message.includes('请求超时')) {
                            showNotification(`初始化文件夹结构失败: ${error.message}`, 'error');
                        }
                        reject(error);
                    });
                });
            }
            
            // ==================== 加载文件夹树（一次性加载并缓存） ====================
            function loadFolderTree(forceRefresh = false) {
                console.log('加载文件夹树... 强制刷新:', forceRefresh);
                
                // 如果已有缓存且不是强制刷新，直接使用缓存（不显示加载条，不发请求）
                if (cachedTreeData && !forceRefresh) {
                    console.log('✓ 使用缓存的树数据，无需网络请求');
                    renderFolderTree(cachedTreeData);
                    return;
                }
                
                // 需要刷新数据时才显示加载条
                showLoading(true);
                
                // 再次获取最新的token和用户信息，确保使用最新值
                const latestToken = localStorage.getItem('access_token') || localStorage.getItem('aiLearningToken');
                const latestUser = JSON.parse(localStorage.getItem('aiLearningUser') || '{}');
                
                // 确保有用户ID
                if (!latestUser || !latestUser.id) {
                    showLoading(false);
                    console.error('用户信息不完整，无法加载文件夹树');
                    showNotification('用户信息不完整，请重新登录', 'error');
                    return;
                }
                
                // 调用API时传递user_id参数
                enhancedFetch(`${API_BASE_URL}/api/cloud_disk/files?user_id=${latestUser.id}`, {
                    headers: {
                        'Authorization': `Bearer ${latestToken}`
                    }
                })
                .then(response => {
                    console.log('获取文件夹响应状态:', response.status);
                    
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: 获取文件夹失败`);
                    }
                    return response.json();
                })
                .then(data => {
                    console.log('获取文件夹响应数据:', data);
                    showLoading(false);
                    
                    if (!data) {
                        throw new Error('服务器返回空数据');
                    }
                    
                    if (data.tree && data.tree.length > 0) {
                        // 缓存树数据
                        cachedTreeData = data.tree[0];
                        console.log('✓ 缓存树数据成功');
                        renderFolderTree(cachedTreeData);
                    } else {
                        console.warn('没有文件夹数据，显示空状态');
                        showNotification('暂无文件', 'info');
                    }
                })
                .catch(error => {
                    showLoading(false);
                    console.error('加载文件夹失败:', error.message);
                    // 显示详细的错误信息
                    showNotification(`加载文件夹失败: ${error.message}`, 'error');
                });
            }
            
            // ==================== 渲染文件夹树 ====================
            function renderFolderTree(rootFolder, level = 0) {
                const container = document.getElementById('folderTree');
                
                if (level === 0) {
                    container.innerHTML = '';
                }
                
                // 渲染根文件夹
                const folderItem = document.createElement('div');
                folderItem.className = 'folder-item' + (level === 0 ? ' active' : '');
                folderItem.dataset.folderPath = rootFolder.path;  // 添加路径标识
                folderItem.onclick = (e) => {
                    e.stopPropagation();
                    selectFolder(rootFolder.path, rootFolder.name, e.target);
                };
                
                folderItem.innerHTML = `
                    <span class="folder-item-icon">${level === 0 ? '📁' : '📂'}</span>
                    <span class="folder-item-name">${rootFolder.name}</span>
                `;
                
                if (level === 0) {
                    container.appendChild(folderItem);
                    // 先调用 selectFolder 加载文件，再设置 selectedFolderPath（避免初始化时条件检查过早返回）
                    selectFolder(rootFolder.path, rootFolder.name, folderItem);
                } else {
                    const parentItem = container.querySelector('.folder-item.active');
                    if (parentItem) {
                        parentItem.parentNode.insertBefore(folderItem, parentItem.nextSibling);
                    }
                }
                
                // 递归渲染子文件夹
                if (rootFolder.children && rootFolder.children.length > 0) {
                    rootFolder.children.forEach(child => {
                        if (child.type === 'folder') {
                            renderSubFolder(child, level + 1, container);
                        }
                    });
                }
            }
            
            // 渲染子文件夹（支持展开/收起）
            function renderSubFolder(folder, level, container) {
                const indent = level * 20;
                const hasChildren = folder.children && folder.children.some(c => c.type === 'folder');
                const isExpanded = expandedFolders.has(folder.path);
                
                // 创建文件夹项目容器
                const folderItem = document.createElement('div');
                folderItem.className = 'folder-item folder-item-nested';
                folderItem.style.paddingLeft = indent + 'px';
                folderItem.dataset.folderPath = folder.path;
                
                // 创建展开/收起按钮
                let toggleHTML = '';
                if (hasChildren) {
                    toggleHTML = `<span class="folder-toggle" onclick="toggleFolder(event, '${folder.path}')">
                        ${isExpanded ? '▼' : '▶'}
                    </span>`;
                } else {
                    toggleHTML = `<span class="folder-toggle" style="opacity: 0;">·</span>`;
                }
                
                // 创建点击选择文件夹的部分
                const selectHTML = `
                    <span class="folder-item-icon">📂</span>
                    <span class="folder-item-name">${folder.name}</span>
                `;
                
                folderItem.innerHTML = toggleHTML + selectHTML;
                
                // 点击文件夹名称时选择文件夹
                folderItem.querySelector('.folder-item-name').parentElement.onclick = (e) => {
                    e.stopPropagation();
                    selectFolder(folder.path, folder.name, folderItem);
                };
                
                container.appendChild(folderItem);
                
                // 递归渲染子文件夹
                if (hasChildren && isExpanded) {
                    folder.children.forEach(child => {
                        if (child.type === 'folder') {
                            renderSubFolder(child, level + 1, container);
                        }
                    });
                }
            }
            
            // 切换文件夹展开/收起
            function toggleFolder(event, folderPath) {
                event.stopPropagation();
                
                if (expandedFolders.has(folderPath)) {
                    expandedFolders.delete(folderPath);
                    console.log(`▶ 收起文件夹: ${folderPath}`);
                } else {
                    expandedFolders.add(folderPath);
                    console.log(`▼ 展开文件夹: ${folderPath}`);
                }
                
                // 重新渲染（使用缓存，不发请求）
                if (cachedTreeData) {
                    renderFolderTree(cachedTreeData);
                }
            }
            
            // ==================== 选择文件夹 ====================
            function selectFolder(folderPath, folderName, eventElement) {
                // 如果选择同一个文件夹，不需要重新加载（但初始化时 selectedFolderPath 为 null，需要加载）
                if (selectedFolderPath && selectedFolderPath === folderPath) {
                    console.log('同一文件夹，无需重新加载');
                    return;
                }
                
                selectedFolderPath = folderPath;
                console.log(`切换文件夹: ${folderPath}`);
                
                // 清除之前选中的文件
                selectedFiles.clear();
                updateFileOperationsToolbar();
                
                // 更新UI
                document.querySelectorAll('.folder-item').forEach(item => {
                    item.classList.remove('active');
                });
                
                // 标记当前文件夹为活跃
                if (eventElement) {
                    try {
                        const folderElement = eventElement.closest('.folder-item');
                        if (folderElement) {
                            folderElement.classList.add('active');
                        }
                    } catch (e) {
                        console.warn('更新活跃状态失败:', e);
                    }
                }
                
                // 更新路径显示
                document.getElementById('currentPath').textContent = folderPath;
                document.getElementById('contentTitle').textContent = folderName;
                
                // 显示删除按钮和返回上一级按钮（但仅在非根目录时）
                const isRootFolder = folderPath === '/' || folderPath === '/root/files';
                document.getElementById('deleteFolderBtn').style.display = isRootFolder ? 'none' : 'inline-block';
                document.getElementById('backFolderBtn').style.display = isRootFolder ? 'none' : 'inline-block';
                
                // 直接使用缓存数据渲染文件列表，无需网络请求和加载条
                if (cachedTreeData) {
                    const files = findFilesInFolder(cachedTreeData, folderPath);
                    console.log(`✓ 从缓存获取文件: ${files.length} 个`);
                    renderFilesList(files);
                } else {
                    // 没有缓存时才加载（第一次进入文件夹）
                    loadFilesList(folderPath, false);
                }
            }
            
            // ==================== 返回上一级目录 ====================
            function goBackToParentFolder() {
                if (!selectedFolderPath) return;
                
                // 移除末尾的斜杠
                let path = selectedFolderPath.replace(/\/$/, '');
                
                // 检查是否是根目录
                const isRootFolder = path === '/' || path === '/root/files';
                if (isRootFolder) {
                    showNotification('已经在根目录', 'info');
                    return;
                }
                
                // 获取父目录路径
                const lastSlashIndex = path.lastIndexOf('/');
                let parentPath = path.substring(0, lastSlashIndex + 1);
                
                // 如果父路径为空，设为根目录
                if (!parentPath) {
                    parentPath = '/';
                }
                
                console.log(`返回上一级: ${selectedFolderPath} → ${parentPath}`);
                
                // 从树中找到父文件夹的名称
                let parentFolderName = '返回';
                if (cachedTreeData) {
                    const parent = findFolderByPath(cachedTreeData, parentPath);
                    if (parent) {
                        parentFolderName = parent.name;
                    }
                }
                
                // 选择父文件夹
                const parentElements = document.querySelectorAll(`[data-folder-path="${parentPath}"]`);
                const parentElement = parentElements.length > 0 ? parentElements[0] : null;
                selectFolder(parentPath, parentFolderName, parentElement);
            }
            
            // 根据路径查找文件夹
            function findFolderByPath(tree, targetPath) {
                if (tree.path === targetPath) {
                    return tree;
                }
                
                if (tree.children) {
                    for (let child of tree.children) {
                        if (child.type === 'folder') {
                            const result = findFolderByPath(child, targetPath);
                            if (result) {
                                return result;
                            }
                        }
                    }
                }
                
                return null;
            }
            
            // ==================== 刷新当前文件夹（只更新文件列表，不更新缓存） ====================
            function refreshCurrentFolder() {
                if (!selectedFolderPath) return;
                
                console.log(`刷新文件夹 ${selectedFolderPath} 的文件列表`);
                
                // 如果有缓存，直接从缓存中获取并渲染文件列表
                if (cachedTreeData) {
                    const files = findFilesInFolder(cachedTreeData, selectedFolderPath);
                    renderFilesList(files);
                    console.log(`✓ 已刷新 ${selectedFolderPath} 的文件列表 (${files.length} 个文件)`);
                } else {
                    // 没有缓存时使用 loadFilesList
                    loadFilesList(selectedFolderPath, false);
                }
            }
            
            // ==================== 刷新当前文件夹（更新缓存） ====================
            function refreshCurrentFolderWithUpdate() {
                if (!selectedFolderPath) return;
                
                console.log(`刷新文件夹 ${selectedFolderPath} 的文件列表（更新缓存）`);
                
                // 清除缓存，强制重新加载树数据
                cachedTreeData = null;
                
                enhancedFetch(`${API_BASE_URL}/api/cloud_disk/files?user_id=${currentUser.id}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    if (data.tree && data.tree.length > 0) {
                        cachedTreeData = data.tree[0];
                        // 从新缓存中获取当前文件夹的文件
                        const files = findFilesInFolder(cachedTreeData, selectedFolderPath);
                        renderFilesList(files);
                        console.log(`✓ 已刷新 ${selectedFolderPath} 的文件列表 (${files.length} 个文件) - 缓存已更新`);
                    }
                })
                .catch(error => {
                    console.error('刷新文件列表失败:', error);
                    showNotification(`刷新失败: ${error.message}`, 'error');
                });
            }
            
            // ==================== 刷新树结构并保持当前文件夹选择 ====================
            function refreshTreeAndRestoreFolder() {
                const previousFolderPath = selectedFolderPath;
                cachedTreeData = null;
                
                console.log(`刷新树结构，保持文件夹选择: ${previousFolderPath}`);
                showLoading(true);
                
                enhancedFetch(`${API_BASE_URL}/api/cloud_disk/files?user_id=${currentUser.id}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: 获取文件夹失败`);
                    }
                    return response.json();
                })
                .then(data => {
                    showLoading(false);
                    
                    if (data.tree && data.tree.length > 0) {
                        cachedTreeData = data.tree[0];
                        renderFolderTree(cachedTreeData);
                        
                        // 如果之前选中的文件夹不是根文件夹，手动恢复选择
                        if (previousFolderPath && previousFolderPath !== cachedTreeData.path) {
                            // 在下一个事件循环中执行，确保DOM已更新
                            setTimeout(() => {
                                const targetElements = document.querySelectorAll(`[data-folder-path="${previousFolderPath}"]`);
                                if (targetElements.length > 0) {
                                    const targetElement = targetElements[0];
                                    const folderName = targetElement.querySelector('.folder-item-name')?.textContent || previousFolderPath;
                                    selectFolder(previousFolderPath, folderName, targetElement);
                                    console.log(`✓ 恢复文件夹选择: ${previousFolderPath}`);
                                } else {
                                    console.log(`⚠ 文件夹 ${previousFolderPath} 不存在，已切换到根目录`);
                                }
                            }, 0);
                        }
                    }
                })
                .catch(error => {
                    showLoading(false);
                    console.error('刷新树失败:', error);
                    showNotification(`刷新失败: ${error.message}`, 'error');
                });
            }
            
            // ==================== 加载文件列表 ====================
            function loadFilesList(folderPath, showLoadingBar = true) {
                console.log('开始加载文件列表，文件夹路径:', folderPath);
                if (showLoadingBar) showLoading(true);
                
                enhancedFetch(`${API_BASE_URL}/api/cloud_disk/files?user_id=${currentUser.id}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                })
                .then(response => {
                    console.log('获取文件列表响应状态:', response.status);
                    
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: 获取文件列表失败`);
                    }
                    return response.json();
                })
                .then(data => {
                    console.log('获取文件列表成功，数据:', data);
                    if (showLoadingBar) showLoading(false);
                    
                    if (!data || !data.tree || !Array.isArray(data.tree)) {
                        console.warn('响应数据格式不正确，没有tree字段');
                        renderFilesList([]);
                        return;
                    }
                    
                    // 找到对应文件夹的文件
                    const files = findFilesInFolder(data.tree[0], folderPath);
                    console.log(`找到 ${files.length} 个文件在文件夹 ${folderPath}`);
                    renderFilesList(files);
                })
                .catch(error => {
                    if (showLoadingBar) showLoading(false);
                    console.error('加载文件失败:', error.message);
                    showNotification(`加载文件失败: ${error.message}`, 'error');
                });
            }
            
            // 查找文件夹中的文件
            function findFilesInFolder(tree, targetPath) {
                if (tree.path === targetPath) {
                    return tree.children ? tree.children.filter(c => c.type === 'file') : [];
                }
                
                if (tree.children) {
                    for (let child of tree.children) {
                        if (child.type === 'folder') {
                            const result = findFilesInFolder(child, targetPath);
                            if (result.length > 0) {
                                return result;
                            }
                        }
                    }
                }
                
                return [];
            }
            
            // ==================== 渲染文件列表 ====================
            function renderFilesList(files) {
                const fileList = document.getElementById('fileList');
                
                if (!files || files.length === 0) {
                    fileList.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">📄</div>
                            <div class="empty-state-title">暂无文件</div>
                            <div class="empty-state-text">上传文件到此文件夹</div>
                        </div>
                    `;
                    // 清空选中文件
                    selectedFiles.clear();
                    updateFileOperationsToolbar();
                    return;
                }
                
                fileList.innerHTML = '';
                files.forEach(file => {
                    const fileItem = document.createElement('div');
                    fileItem.className = 'file-item';
                    fileItem.dataset.fileId = file.id;
                    fileItem.dataset.fileName = file.original_name;
                    
                    const isSelected = selectedFiles.has(file.id);
                    if (isSelected) {
                        fileItem.classList.add('selected');
                    }
                    
                    fileItem.innerHTML = `
                        <input type="checkbox" class="file-item-checkbox" ${isSelected ? 'checked' : ''} data-file-id="${file.id}">
                        <div class="file-item-icon">${getFileIcon(file.original_name)}</div>
                        <div class="file-item-info">
                            <div class="file-item-name">${file.original_name}</div>
                            <div class="file-item-meta">
                                <span>${formatFileSize(file.file_size)}</span>
                                <span>${formatDate(file.upload_time)}</span>
                            </div>
                        </div>
                        <button class="file-item-preview-btn" title="预览文件" data-file-id="${file.id}" data-file-name="${file.original_name}">
                            👁️
                        </button>
                    `;
                    
                    // 添加点击事件
                    fileItem.addEventListener('click', (e) => {
                        // 如果点击的是checkbox，不阻止默认行为
                        if (e.target.className === 'file-item-checkbox') {
                            return;
                        }
                        // 如果点击的是预览按钮
                        if (e.target.closest('.file-item-preview-btn')) {
                            e.stopPropagation();
                            return;
                        }
                        // 否则切换checkbox状态
                        e.stopPropagation();
                        const checkbox = fileItem.querySelector('.file-item-checkbox');
                        checkbox.checked = !checkbox.checked;
                        toggleFileSelection(file.id, checkbox.checked, fileItem);
                    });
                    
                    // 添加checkbox变更事件
                    const checkbox = fileItem.querySelector('.file-item-checkbox');
                    checkbox.addEventListener('change', (e) => {
                        e.stopPropagation();
                        toggleFileSelection(file.id, checkbox.checked, fileItem);
                    });
                    
                    // 添加预览按钮事件
                    const previewBtn = fileItem.querySelector('.file-item-preview-btn');
                    previewBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        previewFile(file.id, file.original_name);
                    });
                    
                    fileList.appendChild(fileItem);
                });
            }
            
            // ==================== 文件选择管理 ====================
            function toggleFileSelection(fileId, isSelected, fileElement) {
                if (isSelected) {
                    selectedFiles.add(fileId);
                    fileElement.classList.add('selected');
                    console.log(`✓ 选中文件: ${fileId}`);
                } else {
                    selectedFiles.delete(fileId);
                    fileElement.classList.remove('selected');
                    console.log(`✗ 取消选中文件: ${fileId}`);
                }
                updateFileOperationsToolbar();
            }
            
            function updateFileOperationsToolbar() {
                const selectionGroup = document.getElementById('selectionActionsGroup');
                const count = selectedFiles.size;
                
                if (count === 0) {
                    // 未选中文件，隐藏选择相关按钮
                    selectionGroup.style.display = 'none';
                } else {
                    // 选中文件，显示选择相关按钮
                    selectionGroup.style.display = 'flex';
                    document.getElementById('selectedFilesCount').textContent = `已选择 ${count} 个文件`;
                }
            }
            
            function clearFileSelection() {
                selectedFiles.clear();
                document.querySelectorAll('.file-item-checkbox').forEach(checkbox => {
                    checkbox.checked = false;
                });
                document.querySelectorAll('.file-item').forEach(item => {
                    item.classList.remove('selected');
                });
                updateFileOperationsToolbar();
                console.log('已清空所有选择');
            }
            
            // ==================== 文件上传 ====================
            function setupFileUpload() {
                const fileInput = document.getElementById('fileInput');
                
                fileInput.addEventListener('change', function(e) {
                    uploadFiles(e.target.files);
                    this.value = '';
                });
            }
            
            // ==================== 生成新文件名 ====================
            function generateNewFileName(originalName) {
                const lastDotIndex = originalName.lastIndexOf('.');
                if (lastDotIndex === -1) {
                    return originalName + '_1';
                }
                const name = originalName.substring(0, lastDotIndex);
                const ext = originalName.substring(lastDotIndex);
                return name + '_1' + ext;
            }
            
            // ==================== 自定义对话框函数 ====================
            
            // 显示删除确认对话框
            function showDeleteConfirmDialog(message) {
                return new Promise((resolve) => {
                    const overlay = document.getElementById('deleteConfirmDialogOverlay');
                    const messageEl = document.getElementById('deleteConfirmMessage');
                    const confirmBtn = document.getElementById('deleteConfirmBtn');
                    const cancelBtn = document.getElementById('deleteConfirmCancelBtn');
                    
                    messageEl.textContent = message;
                    
                    const handleConfirm = () => {
                        cleanup();
                        resolve(true);
                    };
                    
                    const handleCancel = () => {
                        cleanup();
                        resolve(false);
                    };
                    
                    const cleanup = () => {
                        overlay.classList.remove('show');
                        confirmBtn.removeEventListener('click', handleConfirm);
                        cancelBtn.removeEventListener('click', handleCancel);
                    };
                    
                    confirmBtn.addEventListener('click', handleConfirm);
                    cancelBtn.addEventListener('click', handleCancel);
                    
                    overlay.classList.add('show');
                    confirmBtn.focus();
                });
            }
            
            // 显示冲突文件确认对话框
            function showConflictConfirmDialog(conflictFiles) {
                return new Promise((resolve) => {
                    const overlay = document.getElementById('conflictConfirmDialogOverlay');
                    const filesList = document.getElementById('conflictFilesList');
                    const confirmBtn = document.getElementById('conflictConfirmBtn');
                    const cancelBtn = document.getElementById('conflictCancelBtn');
                    
                    // 清空列表
                    filesList.innerHTML = '';
                    
                    // 添加冲突文件列表
                    conflictFiles.forEach((fileName) => {
                        const item = document.createElement('div');
                        item.className = 'conflict-file-item';
                        item.innerHTML = `
                            <span class="conflict-file-icon">📄</span>
                            <span class="conflict-file-name" title="${fileName}">${fileName}</span>
                        `;
                        filesList.appendChild(item);
                    });
                    
                    const handleConfirm = () => {
                        cleanup();
                        resolve(true);
                    };
                    
                    const handleCancel = () => {
                        cleanup();
                        resolve(false);
                    };
                    
                    const cleanup = () => {
                        overlay.classList.remove('show');
                        confirmBtn.removeEventListener('click', handleConfirm);
                        cancelBtn.removeEventListener('click', handleCancel);
                    };
                    
                    confirmBtn.addEventListener('click', handleConfirm);
                    cancelBtn.addEventListener('click', handleCancel);
                    
                    overlay.classList.add('show');
                    confirmBtn.focus();
                });
            }
            
            // 显示上传文件编辑对话框（显示所有文件，允许点击编辑）
            function showUploadEditDialog(allFiles, conflictFileNames) {
                return new Promise((resolve) => {
                    const overlay = document.getElementById('uploadEditDialogOverlay');
                    const itemsContainer = document.getElementById('uploadListItems');
                    const confirmBtn = document.getElementById('uploadEditConfirmBtn');
                    const cancelBtn = document.getElementById('uploadEditCancelBtn');
                    
                    // 检查元素是否存在
                    if (!overlay || !itemsContainer || !confirmBtn || !cancelBtn) {
                        console.error('对话框元素找不到!', {
                            overlay: !!overlay,
                            itemsContainer: !!itemsContainer,
                            confirmBtn: !!confirmBtn,
                            cancelBtn: !!cancelBtn
                        });
                        resolve(null);
                        return;
                    }
                    
                    console.log(`显示编辑对话框，共 ${allFiles.length} 个文件`);
                    
                    // 清空列表
                    itemsContainer.innerHTML = '';
                    
                    // 创建结果对象来存储文件名映射
                    const result = {};
                    
                    // 为每个上传文件创建列表项
                    allFiles.forEach((file, index) => {
                        const item = document.createElement('div');
                        item.className = 'upload-list-item';
                        
                        const isConflict = conflictFileNames.has(file.name);
                        const fileId = `upload-item-${index}`;
                        
                        // 初始化结果
                        result[index] = {
                            originalName: file.name,
                            finalName: file.name,
                            isConflict: isConflict,
                            file: file
                        };
                        
                        const statusClass = isConflict ? 'conflict' : 'normal';
                        const statusText = isConflict ? '⚠️ 冲突' : '✓ 新文件';
                        
                        item.innerHTML = `
                            <div class="upload-item-status ${statusClass}">
                                <span class="upload-item-status-badge">${statusText}</span>
                            </div>
                            <div class="upload-item-name editable" id="${fileId}" title="点击编辑文件名">${file.name}</div>
                        `;
                        
                        itemsContainer.appendChild(item);
                        
                        // 获取状态显示元素
                        const statusElement = item.querySelector('.upload-item-status');
                        
                        // 绑定编辑事件
                        const nameElement = item.querySelector(`#${fileId}`);
                        let isEditing = false;
                        
                        nameElement.addEventListener('click', (e) => {
                            if (isEditing) return;
                            isEditing = true;
                            
                            // 创建输入框
                            const input = document.createElement('input');
                            input.type = 'text';
                            input.className = 'upload-item-name-input';
                            input.value = result[index].finalName;
                            
                            nameElement.innerHTML = '';
                            nameElement.appendChild(input);
                            input.focus();
                            input.select();
                            
                            // 实时监听输入，更新冲突状态
                            input.addEventListener('input', (e) => {
                                const currentName = e.target.value.trim();
                                
                                console.log(`实时检查文件名: ${currentName}`);
                                
                                // 检查当前名称是否冲突（检查与现有文件名）
                                const hasConflictWithExisting = conflictFileNames.has(currentName);
                                console.log(`与现有文件冲突: ${hasConflictWithExisting}`);
                                
                                // 检查与其他待上传文件的冲突（需要遍历所有输入框）
                                let hasConflictWithOthers = false;
                                const allInputs = itemsContainer.querySelectorAll('.upload-item-name-input, .upload-item-name');
                                for (let otherItem of allInputs) {
                                    // 跳过自己
                                    if (otherItem === input) continue;
                                    
                                    let otherName = '';
                                    if (otherItem.className === 'upload-item-name-input') {
                                        // 其他项也在编辑
                                        otherName = otherItem.value.trim();
                                    } else if (otherItem.className.includes('upload-item-name')) {
                                        // 其他项不在编辑，显示的是最终名称
                                        otherName = otherItem.textContent.trim();
                                    }
                                    
                                    if (otherName && otherName === currentName) {
                                        hasConflictWithOthers = true;
                                        console.log(`与其他待上传文件冲突: ${otherName}`);
                                        break;
                                    }
                                }
                                
                                const hasConflict = hasConflictWithExisting || hasConflictWithOthers;
                                console.log(`最终冲突判断: ${hasConflict}`);
                                
                                // 更新状态显示
                                if (hasConflict) {
                                    statusElement.className = 'upload-item-status conflict';
                                    statusElement.innerHTML = '<span class="upload-item-status-badge">⚠️ 冲突</span>';
                                } else {
                                    statusElement.className = 'upload-item-status normal';
                                    statusElement.innerHTML = '<span class="upload-item-status-badge">✓ 新文件</span>';
                                }
                            });
                            
                            // 保存文件名
                            const saveFileName = () => {
                                const newName = input.value.trim();
                                if (newName === '') {
                                    showNotification('文件名不能为空', 'warning');
                                    return;
                                }
                                result[index].finalName = newName;
                                nameElement.classList.add('editable');
                                nameElement.innerHTML = newName;
                                
                                // 最终确认冲突状态
                                const hasConflictWithExisting = conflictFileNames.has(newName);
                                let hasConflictWithOthers = false;
                                for (let key in result) {
                                    if (key !== String(index) && result[key].finalName === newName) {
                                        hasConflictWithOthers = true;
                                        break;
                                    }
                                }
                                
                                const hasConflict = hasConflictWithExisting || hasConflictWithOthers;
                                
                                if (hasConflict) {
                                    statusElement.className = 'upload-item-status conflict';
                                    statusElement.innerHTML = '<span class="upload-item-status-badge">⚠️ 冲突</span>';
                                } else {
                                    statusElement.className = 'upload-item-status normal';
                                    statusElement.innerHTML = '<span class="upload-item-status-badge">✓ 新文件</span>';
                                }
                                
                                isEditing = false;
                            };
                            
                            // 回车或失焦时保存
                            input.addEventListener('keydown', (e) => {
                                if (e.key === 'Enter') {
                                    saveFileName();
                                } else if (e.key === 'Escape') {
                                    nameElement.innerHTML = result[index].finalName;
                                    isEditing = false;
                                }
                            });
                            
                            input.addEventListener('blur', saveFileName);
                        });
                    });
                    
                    const handleConfirm = async () => {
                        // 验证所有文件名
                        const fileNameSet = new Set();
                        const conflictingFiles = [];
                        
                        for (let key in result) {
                            const newName = result[key].finalName.trim();
                            if (newName === '') {
                                showNotification(`文件 "${result[key].originalName}" 的名称不能为空`, 'warning');
                                return;
                            }
                            result[key].finalName = newName;
                            
                            // 检查是否与现有文件冲突
                            if (conflictFileNames.has(newName)) {
                                conflictingFiles.push(newName);
                            }
                            
                            // 检查是否与其他待上传文件重复
                            if (fileNameSet.has(newName)) {
                                showNotification(`文件名 "${newName}" 重复，请修改`, 'warning');
                                return;
                            }
                            fileNameSet.add(newName);
                        }
                        
                        // 如果有冲突文件，提示用户
                        if (conflictingFiles.length > 0) {
                            // 使用自定义对话框而不是原生 confirm
                            const shouldContinue = await showConflictConfirmDialog(conflictingFiles);
                            if (!shouldContinue) {
                                return;
                            }
                        }
                        
                        cleanup();
                        resolve(result);
                    };
                    
                    const handleCancel = () => {
                        cleanup();
                        resolve(null);
                    };
                    
                    const cleanup = () => {
                        overlay.classList.remove('show');
                        confirmBtn.removeEventListener('click', handleConfirm);
                        cancelBtn.removeEventListener('click', handleCancel);
                    };
                    
                    confirmBtn.addEventListener('click', handleConfirm);
                    cancelBtn.addEventListener('click', handleCancel);
                    
                    overlay.classList.add('show');
                    confirmBtn.focus();
                });
            }
            
            // ==================== 检查和处理文件冲突（异步） ====================
            async function checkAndHandleFileConflicts(files, folderPath) {
                // 获取当前文件夹的现有文件
                let existingFileNames = new Set();
                
                if (cachedTreeData) {
                    const existingFiles = findFilesInFolder(cachedTreeData, folderPath);
                    existingFileNames = new Set(existingFiles.map(f => f.original_name));
                    console.log(`找到 ${existingFiles.length} 个现有文件`);
                } else {
                    console.log('缓存不存在，将跳过冲突检查');
                }
                
                // 无论有没有冲突，都显示编辑对话框给用户预览和编辑
                console.log('显示上传文件编辑对话框...');
                const editResult = await showUploadEditDialog(files, existingFileNames);
                
                if (editResult === null) {
                    // 用户取消了整个操作
                    console.log('用户已取消上传');
                    return [];
                }
                
                // 处理用户的选择，构建最终上传的文件列表
                const processedFiles = [];
                for (let key in editResult) {
                    const entry = editResult[key];
                    processedFiles.push({
                        originalFile: entry.file,
                        finalName: entry.finalName
                    });
                    
                    if (entry.originalName !== entry.finalName) {
                        console.log(`✓ 文件将重命名: ${entry.originalName} → ${entry.finalName}`);
                    } else {
                        console.log(`✓ 文件将上传: ${entry.finalName}`);
                    }
                }
                
                console.log(`准备上传 ${processedFiles.length} 个文件`);
                return processedFiles;
            }
            
            async function uploadFiles(files) {
                if (!selectedFolderPath) {
                    showNotification('请先选择文件夹', 'warning');
                    return;
                }
                
                if (files.length === 0) return;
                
                // 将 FileList 转换为数组
                const fileArray = Array.from(files);
                console.log(`用户选择了 ${fileArray.length} 个文件`);
                
                // 检查并处理文件冲突（等待用户编辑）
                const processedFiles = await checkAndHandleFileConflicts(fileArray, selectedFolderPath);
                
                if (processedFiles.length === 0) {
                    showNotification('已取消上传', 'info');
                    return;
                }
                
                console.log(`开始上传 ${processedFiles.length} 个文件到 ${selectedFolderPath}`);
                showLoading(true);
                
                let uploadedCount = 0;
                let errorCount = 0;
                
                // 顺序上传每个文件
                for (let i = 0; i < processedFiles.length; i++) {
                    const { originalFile, finalName } = processedFiles[i];
                    console.log(`上传文件 ${i + 1}/${processedFiles.length}: ${finalName}`);
                    
                    try {
                        const formData = new FormData();
                        // 使用 FormData 的第三个参数指定上传后的文件名
                        formData.append('file', originalFile, finalName);
                        formData.append('folder_path', selectedFolderPath);
                        
                        console.log(`正在上传: ${finalName}`);
                        const response = await enhancedFetch(`${API_BASE_URL}/api/cloud_disk/upload`, {
                            method: 'POST',
                            headers: {
                                'Authorization': `Bearer ${token}`
                            },
                            body: formData
                        });
                        
                        console.log(`${finalName} 响应状态: ${response.status}`);
                        
                    if (!response.ok) {
                        // 尝试读取服务器返回的错误详情
                        let errorDetail = `HTTP ${response.status}`;
                        let errorData = null;
                        try {
                            errorData = await response.json();
                            errorDetail = errorData.detail || errorData.message || errorData.error || errorDetail;
                            console.error(`${finalName} 服务器错误详情:`, errorData);
                            
                            // 分析常见错误类型，提供更友好的提示
                            if (errorDetail.includes('Permission denied') || errorDetail.includes('权限')) {
                                errorDetail = `文件系统权限错误：服务器无法在目标目录创建文件。\n\n错误详情：${errorDetail}\n\n解决方案：\n1. 检查服务器目录权限（需要写入权限）\n2. 确保运行服务器的用户有权限访问目标目录\n3. 联系管理员检查服务器配置`;
                            } else if (errorDetail.includes('No space left') || errorDetail.includes('磁盘空间')) {
                                errorDetail = `存储空间不足：服务器磁盘空间已满。\n\n错误详情：${errorDetail}\n\n解决方案：\n1. 清理服务器磁盘空间\n2. 删除不需要的文件\n3. 联系管理员增加存储空间`;
                            } else if (errorDetail.includes('File too large') || errorDetail.includes('文件太大')) {
                                errorDetail = `文件大小超限：文件超过服务器允许的最大大小。\n\n错误详情：${errorDetail}\n\n解决方案：\n1. 压缩文件后重新上传\n2. 分割大文件\n3. 联系管理员调整文件大小限制`;
                            } else if (errorDetail.includes('Invalid file type') || errorDetail.includes('文件类型')) {
                                errorDetail = `不支持的文件类型：服务器不允许上传此类型的文件。\n\n错误详情：${errorDetail}\n\n解决方案：\n1. 检查文件类型是否在允许列表中\n2. 联系管理员添加文件类型支持`;
                            }
                        } catch (e) {
                            // 如果无法解析JSON，尝试读取文本
                            try {
                                const errorText = await response.text();
                                if (errorText) {
                                    errorDetail = `${errorDetail}: ${errorText.substring(0, 200)}`;
                                }
                            } catch (e2) {
                                // 忽略文本读取错误
                            }
                        }
                        throw new Error(errorDetail);
                    }
                        
                        // 尝试解析JSON
                        let data;
                        try {
                            data = await response.json();
                            console.log(`${finalName} 上传成功:`, data);
                        } catch (e) {
                            console.log(`${finalName} 上传成功（无JSON）`);
                            data = { message: '成功' };
                        }
                        
                        uploadedCount++;
                        console.log(`✓ ${finalName} 上传成功 (${uploadedCount}/${processedFiles.length})`);
                        
                } catch (error) {
                    errorCount++;
                    const errorMsg = error.message || '未知错误';
                    console.error(`✗ ${finalName} 上传失败: ${errorMsg} (${uploadedCount + errorCount}/${processedFiles.length})`);
                    console.error('完整错误信息:', error);
                    
                    // 如果是第一个失败的文件，显示详细错误通知
                    if (errorCount === 1) {
                        // 对于权限错误，显示更友好的提示
                        if (errorMsg.includes('权限') || errorMsg.includes('Permission denied')) {
                            showNotification('上传失败：文件系统权限错误。请联系管理员检查服务器目录权限。', 'error');
                        } else {
                            // 截断过长的错误信息，只显示前100个字符
                            const shortMsg = errorMsg.length > 100 ? errorMsg.substring(0, 100) + '...' : errorMsg;
                            showNotification(`上传失败: ${shortMsg}`, 'error');
                        }
                    }
                }
                }
                
                // 所有文件处理完毕
                console.log(`\n=== 上传完成 ===`);
                console.log(`成功: ${uploadedCount}, 失败: ${errorCount}`);
                showLoading(false);
                
                // 显示通知
                if (errorCount === 0 && uploadedCount > 0) {
                    showNotification(`✓ 成功上传 ${uploadedCount} 个文件`, 'success');
                } else if (uploadedCount === 0) {
                    showNotification(`✗ 上传失败，${errorCount} 个文件失败。请查看控制台了解详细错误信息`, 'error');
                } else if (errorCount > 0) {
                    showNotification(`⚠ 成功上传 ${uploadedCount} 个，失败 ${errorCount} 个。请查看控制台了解详细错误信息`, 'warning');
                }
                
                // 延迟刷新当前文件夹的文件列表（更新缓存，实时显示新文件）
                console.log('等待1秒后刷新当前文件夹的文件列表...');
                setTimeout(() => {
                    console.log('开始刷新文件列表');
                    // 刷新当前文件夹的文件列表并更新缓存，保持用户在同一个文件夹中，并实时显示新文件
                    refreshCurrentFolderWithUpdate();

                })
                .then(blob => {
                    console.log('文件大小:', blob.size, '字节');
                    
                    // 根据文件类型处理
                    if (imageTypes.includes(ext)) {

                                const reader = new FileReader();
                                reader.onload = (e) => {

                                        renderTextPreview(e.target.result, ext, content);
                                    } catch (err) {
                                        throw err;
                                    }
                                };
                                reader.onerror = () => {
                                    throw new Error('无法读取文件内容');
                                };
                                reader.readAsText(blob);

                    // 设置下载按钮
                    downloadBtn.onclick = () => {

            function openFullscreenPreview() {

                    // 重置缩放和旋转

                    currentRotation = 0;
                    
                    // 显示加载状态
                    wrapper.innerHTML = '<div class="loading-indicator">加载中...</div>';
                    
                    // 根据文件类型显示内容
                    if (fullscreenPreviewType === 'image') {
                        // 使用DOM创建元素而不是innerHTML，更安全且性能更好
                        const img = document.createElement('img');
                        img.id = 'fullscreenImage';
                        img.src = fullscreenPreviewUrl;
                        img.alt = '预览图片';
                        
                        // 基础样式设置
                        img.style.maxWidth = '100%';
                        img.style.maxHeight = '100%';
                        img.style.objectFit = 'contain';

                        img.style.msTransform = 'scale(1) rotate(0deg)';
                        img.style.transform = 'scale(1) rotate(0deg)';
                        
                        // 加载完成处理
                        img.onload = function() {
                            wrapper.innerHTML = '';
                            wrapper.appendChild(img);
                        };
                        
                        // 加载错误处理
                        img.onerror = function() {
                            console.error('图片加载失败:', fullscreenPreviewUrl);
                            wrapper.innerHTML = '<div class="error-message">图片加载失败，请尝试重新预览</div>';
                        };
                        
                        // 超时处理
                        setTimeout(function() {
                            if (img.complete === false) {
                                wrapper.innerHTML = '<div class="error-message">图片加载超时，请检查网络连接</div>';
                            }
                        }, 30000); // 30秒超时
                    } else if (fullscreenPreviewType === 'pdf') {
                        // 检查浏览器是否支持PDF预览
                        const iframe = document.createElement('iframe');
                        iframe.src = fullscreenPreviewUrl;
                        iframe.title = 'PDF预览';
                        iframe.style.width = '100%';
                        iframe.style.height = '100%';
                        iframe.style.border = 'none';
                        
                        // 浏览器兼容性处理
                        iframe.style.webkitTransform = 'scale(1)';
                        iframe.style.msTransform = 'scale(1)';
                        iframe.style.transform = 'scale(1)';
                        iframe.style.webkitTransformOrigin = 'center center';
                        iframe.style.msTransformOrigin = 'center center';
                        iframe.style.transformOrigin = 'center center';
                        
                        // 添加PDF加载状态处理
                        iframe.onload = function() {
                            wrapper.innerHTML = '';
                            wrapper.appendChild(iframe);
                            
                            // 设置适当的滚动行为
                            wrapper.style.overflow = 'hidden';
                        };
                        
                        // 由于iframe跨域限制，我们无法直接检测PDF加载失败
                        // 使用try-catch来捕获可能的错误
                        try {
                            wrapper.appendChild(iframe);

                            console.error('PDF预览加载异常:', e);
                            wrapper.innerHTML = '<div class="error-message">PDF加载异常，请尝试下载文件</div>';

                    // 禁用背景滚动，兼容所有现代浏览器

            function zoomIn() {
                currentZoomLevel += 0.1;
                
                if (fullscreenPreviewType === 'image') {
                    const img = document.getElementById('fullscreenImage');
                    if (img) {
                        img.style.transform = `scale(${currentZoomLevel}) rotate(${currentRotation}deg)`;
                    }

                    const wrapper = document.getElementById('fullscreenPreviewWrapper');
                    const iframe = wrapper.querySelector('iframe');
                    if (iframe) {

                    }
                }

            function zoomOut() {
                if (currentZoomLevel > 0.2) {
                    currentZoomLevel -= 0.1;
                    
                    if (fullscreenPreviewType === 'image') {
                        const img = document.getElementById('fullscreenImage');
                        if (img) {
                            img.style.transform = `scale(${currentZoomLevel}) rotate(${currentRotation}deg)`;
                        }
                    } else if (fullscreenPreviewType === 'pdf') {
                        const wrapper = document.getElementById('fullscreenPreviewWrapper');
                        const iframe = wrapper.querySelector('iframe');
                        if (iframe) {

                            if (currentZoomLevel <= 1) {
                                wrapper.style.overflow = 'hidden';

                    }
                }
