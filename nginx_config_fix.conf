# 修复后的 Nginx 配置
# 在 server 块中添加以下配置

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    http2 on;
    listen 443 quic; # 启用 HTTP/3
    server_name aistudy.icu;
    index index.php index.html index.htm;
    root /www/wwwroot/aistudy.icu;

    # =============================
    # 🚀 关键修复：文件上传大小限制
    # =============================
    client_max_body_size 1G;  # 允许上传最大 1GB 文件
    client_body_timeout 300s;  # 客户端请求体超时时间
    client_body_buffer_size 128k;  # 客户端请求体缓冲区大小

    # 证书配置（保持原样）
    ssl_certificate /www/server/panel/vhost/cert/aistudy.icu/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/aistudy.icu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:EECDH+AES256:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    error_page 497 https://$host$request_uri;

    include /www/server/panel/vhost/nginx/extension/aistudy.icu/*.conf;
    include /www/server/panel/vhost/nginx/well-known/aistudy.icu.conf;

    # =============================
    # 🔒 反向代理到 Python 后端（已关闭缓存和缓冲）
    # =============================
    location / {
        proxy_set_header X-Real-Port $remote_port;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Remote-Host $remote_addr;
        proxy_pass http://localhost:5001; # 保持不变

        # 传递必要的请求头（保持不变）
        proxy_set_header Host localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # =============================
        # 🚀 大文件上传优化配置
        # =============================
        # 超时设置（大文件上传需要更长时间）
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;    # 增加到10分钟
        proxy_read_timeout 600s;    # 增加到10分钟
        
        # 请求体大小限制（与 client_max_body_size 保持一致）
        proxy_request_buffering off;  # 禁用请求缓冲，支持流式上传
        proxy_max_temp_file_size 0;   # 禁用临时文件，直接转发

        # =============================
        # ⚡ 关闭缓冲（核心配置）
        # =============================
        proxy_buffering off; # 禁用反向代理缓冲（关键！确保数据实时转发）
        proxy_cache off; # 再次确认关闭缓存（双重保障）
        chunked_transfer_encoding on; # 启用分块传输编码（适配流式不定长数据）
        tcp_nopush off; # 禁用Nagle算法（避免小数据块合并延迟）
        tcp_nodelay on; # 启用TCP无延迟（确保即时发送小数据包）
    }

    # 禁止访问敏感文件（保持不变）
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|LICENSE|README.md) {
        return 404;
    }

    # SSL 证书验证目录（保持不变）
    location /.well-known {
        allow all;
    }

    # 防止上传敏感文件（保持不变）
    if ($uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    # 日志（保持不变）
    access_log /www/wwwlogs/aistudy.icu.log;
    error_log /www/wwwlogs/aistudy.icu.error.log;
}



